[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "aw-watcher-lid"
dynamic = ["version"]
description = "ActivityWatch watcher for laptop lid events and system suspend/resume"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MPL-2.0"}
authors = [{ name = "Tobias Brox", email = "tobias@redpill-linpro.com" }]
keywords = ["activitywatch", "watcher", "laptop", "lid", "suspend", "time-tracking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aw-client>=0.5.13",
    "aw-core>=0.5.16",
    "dbus-python>=1.3.2",
    "PyGObject>=3.42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.0",
    "ruff>=0.16",
    "pre-commit>=4.0",
]

[project.scripts]
aw-watcher-lid = "aw_watcher_lid.__main__:main"

[project.urls]
Homepage = "https://github.com/tobixen/aw-watcher-lid"
Repository = "https://github.com/tobixen/aw-watcher-lid"
Issues = "https://github.com/tobixen/aw-watcher-lid/issues"
Changelog = "https://github.com/tobixen/aw-watcher-lid/blob/main/CHANGELOG.md"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "aw_watcher_lid/_version.py"

[tool.hatch.build.targets.sdist]
exclude = [".claude", ".prompts"]

[tool.hatch.build.targets.wheel]
packages = ["aw_watcher_lid"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["aw_watcher_lid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
