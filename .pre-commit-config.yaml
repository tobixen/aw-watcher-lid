repos:
  # === PRE-COMMIT STAGE (quick checks on every commit) ===

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # === PRE-PUSH STAGE (full test suite before pushing) ===

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -m pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # === PRE-PUSH: Link checker (with local cache for speed) ===

  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        # Whole-tree scan (args end in '.', pass_filenames: false).  Excludes
        # and accepted status codes go in lychee.toml.
        args: ["--no-progress", "--timeout", "10", "--cache", "--max-cache-age", "1d", "."]
        pass_filenames: false
        stages: [pre-push]

  # === COMMIT-MSG: Enforce Conventional Commits ===

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/pycalendar/ai-prompt-auto-commit
    rev: v0.0.9
    hooks:
      - id: unstage-ai-prompts
      - id: append-ai-prompts
        stages: [prepare-commit-msg]
      - id: archive-ai-prompts
        stages: [post-commit]
      - id: prepare-ai-repository
        stages: [manual]
